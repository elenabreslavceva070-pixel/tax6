<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чек-лист — начало работы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }
        .sheet {
            max-width: 700px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .sheet-header {
            background: #FFFFFF;
            padding: 12px 16px;
            border-bottom: 1px solid #E2E9F2;
        }
        .sheet-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f2f3e;
        }
        .sheet-header p {
            font-size: 0.7rem;
            color: #5b6f82;
            margin-top: 2px;
        }
        .sheet-content {
            padding: 16px;
            background: #FFFFFF;
        }
        .section {
            background: #F2F4F8;
            border-radius: 16px;
            padding: 14px;
            border-left: 3px solid #C3D7FF;
        }
        .section-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: #1f2f3e;
            margin-bottom: 12px;
        }
        .stages-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        .stage-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            padding: 5px 10px;
            border-radius: 32px;
            border: 1px solid #DDE3EC;
        }
        .stage-num {
            font-weight: 700;
            font-size: 0.75rem;
            background: #C3D7FF;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            flex-shrink: 0;
        }
        .stage-select {
            flex: 1;
        }
        select {
            width: 100%;
            padding: 5px 8px;
            border-radius: 24px;
            border: 1px solid #CDD9ED;
            background: #FFFFFF;
            font-size: 0.7rem;
            font-family: inherit;
            cursor: pointer;
        }
        .status-icon {
            font-size: 1rem;
            min-width: 28px;
            text-align: center;
            cursor: pointer;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .tooltip {
            position: relative;
            display: inline-flex;
            cursor: pointer;
        }
        .tooltip .tooltip-text {
            visibility: hidden;
            background-color: #1f2f3e;
            color: #fff;
            text-align: left;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.7rem;
            position: absolute;
            z-index: 100;
            top: 50%;
            right: 100%;
            transform: translateY(-50%);
            margin-right: 10px;
            white-space: normal;
            min-width: 200px;
            max-width: 280px;
            word-break: break-word;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        .btn {
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            background: #C3D7FF;
            color: #1f2f3e;
        }
    </style>
</head>
<body>
<div class="sheet">
    <div class="sheet-header">
        <h2>📋 Чек-лист — Что не упустить в начале работы</h2>
        <p>Выберите верные действия в правильной последовательности</p>
    </div>
    <div class="sheet-content">
        <div class="section">
            <div class="section-title">🔍 Этапы консультирования</div>
            <div id="stagesList" class="stages-list"></div>
            <button id="checkBtn" class="btn">✓ Проверить</button>
        </div>
    </div>
</div>

<script>
    const FIXED_POSITIONS = {
        1: "Согласовать условия работы",
        2: "Заключить договор",
        3: "Оформить доверенность при необходимости",
        7: "Проанализировать учет и нормы",
        8: "Подготовить варианты решения",
        9: "Обсудить варианты с клиентом и выбрать лучший"
    };

    const FLEXIBLE_SET = new Set([
        "Запросить уставные документы",
        "Узнать систему налогообложения",
        "Узнать, есть ли у клиента претензии или проверки от налоговой"
    ]);

    const ALL_OPTIONS = [
        "Согласовать условия работы", "Заключить договор", "Оформить доверенность при необходимости",
        "Запросить уставные документы", "Узнать систему налогообложения",
        "Узнать, есть ли у клиента претензии или проверки от налоговой",
        "Проанализировать учет и нормы", "Подготовить варианты решения",
        "Обсудить варианты с клиентом и выбрать лучший",
        "Дать бесплатный совет", "Начать работать по описанию клиента",
        "Предложить один вариант без альтернатив", "Оставить клиента без поддержки"
    ];

    function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; }
        return copy;
    }

    let userSelections = new Array(9).fill("");
    let isCompleted = false;
    let randomOptions = shuffleArray(ALL_OPTIONS);
    let errorCount = new Array(9).fill(0);

    const stagesContainer = document.getElementById('stagesList');
    const checkBtn = document.getElementById('checkBtn');

    function loadData() {
        const saved = localStorage.getItem('checklist_step1');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                userSelections = data.userSelections || new Array(9).fill("");
                isCompleted = data.isCompleted || false;
                if (data.randomOptions) randomOptions = data.randomOptions;
                if (data.errorCount) errorCount = data.errorCount;
            } catch(e) {}
        }
        renderStages();
    }

    function saveData() {
        localStorage.setItem('checklist_step1', JSON.stringify({
            userSelections, isCompleted, randomOptions, errorCount
        }));
        localStorage.setItem('step1_completed', isCompleted ? 'true' : 'false');
        localStorage.setItem('step1_selections', JSON.stringify(userSelections));
        window.dispatchEvent(new StorageEvent('storage', { key: 'step1_completed' }));
    }

    function isChecklistCorrect() {
        for (const [pos, expected] of Object.entries(FIXED_POSITIONS)) {
            if (userSelections[parseInt(pos)-1] !== expected) return false;
        }
        const flexiblePositions = [userSelections[3], userSelections[4], userSelections[5]];
        const flexibleSetFromSelections = new Set(flexiblePositions);
        if (flexibleSetFromSelections.size !== 3) return false;
        for (const item of FLEXIBLE_SET) if (!flexibleSetFromSelections.has(item)) return false;
        return true;
    }

    function getCorrectForPos(pos) {
        if (FIXED_POSITIONS[pos]) return FIXED_POSITIONS[pos];
        if (pos >= 4 && pos <= 6) return "Можно выбрать в любом порядке:\n• Запросить уставные документы\n• Узнать систему налогообложения\n• Узнать о претензиях или проверках от налоговой";
        return "";
    }

    function renderStages() {
        stagesContainer.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const pos = i+1;
            const row = document.createElement('div');
            row.className = 'stage-row';
            row.innerHTML = `
                <div class="stage-num">${pos}</div>
                <div class="stage-select">
                    <select data-idx="${i}" class="stage-selector" ${isCompleted ? 'disabled' : ''}>
                        <option value="">--</option>
                        ${randomOptions.map(opt => `<option value="${opt.replace(/"/g, '&quot;')}" ${userSelections[i] === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>
                </div>
                <div class="status-icon" id="icon${i}"></div>
            `;
            stagesContainer.appendChild(row);
        }

        if (!isCompleted) {
            document.querySelectorAll('.stage-selector').forEach(select => {
                select.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.idx);
                    userSelections[idx] = e.target.value;
                    errorCount[idx] = 0;
                    const iconSpan = document.getElementById(`icon${idx}`);
                    if (iconSpan) iconSpan.innerHTML = '';
                    saveData();
                });
            });
        }
        if (isCompleted) updateIconsAfterCheck(true);
    }

    function updateIconsAfterCheck(isFinalCheck = true) {
        for (let i = 0; i < 9; i++) {
            const iconSpan = document.getElementById(`icon${i}`);
            const pos = i+1;
            const selected = userSelections[i];
            let isItemCorrect = false;
            if (FIXED_POSITIONS[pos]) isItemCorrect = (selected === FIXED_POSITIONS[pos]);
            else if (pos >= 4 && pos <= 6) isItemCorrect = (selected !== "" && FLEXIBLE_SET.has(selected));
            
            if (isItemCorrect && selected !== "") {
                iconSpan.innerHTML = '✅';
                errorCount[i] = 0;
            } else if (selected !== "") {
                if (isFinalCheck) errorCount[i]++;
                const correctAnswer = getCorrectForPos(pos);
                if (errorCount[i] === 1) {
                    iconSpan.innerHTML = '❌';
                } else {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'tooltip';
                    wrapper.innerHTML = `💡<span class="tooltip-text">Правильно: ${correctAnswer}</span>`;
                    wrapper.id = `icon${i}`;
                    wrapper.className = 'status-icon tooltip';
                    iconSpan.parentNode.replaceChild(wrapper, iconSpan);
                }
            } else {
                iconSpan.innerHTML = '';
                errorCount[i] = 0;
            }
        }
    }

    function verifyChecklist() {
        if (isCompleted) return;
        const correct = isChecklistCorrect();
        const allFilled = userSelections.every(v => v !== "");
        updateIconsAfterCheck(true);
        if (correct && allFilled) {
            isCompleted = true;
            saveData();
            document.querySelectorAll('.stage-selector').forEach(sel => sel.disabled = true);
        }
    }

    checkBtn.addEventListener('click', verifyChecklist);
    loadData();
</script>
</body>
</html>
